[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorvault-engine"
version = "0.1.0"
authors = [
    { name = "Gabi Ulianitski", email = "gabi@example.com" }
]
description = "VectorVault: A database migration and schema version-control framework for AI vectors (The Liquibase/Flyway for vector dimensions)."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0",
    "click>=8.1.0",     # For professional, clean CLI argument parsing
    "sqlite-vec>=0.1.1",
    "sentence-transformers>=2.2.2"
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1.0"]  # PostgreSQL pgvector runtime support
dev = ["pytest>=7.0.0"]

# Bundled dependency grouping
all = [
    "vectorvault-engine[postgres,dev]"
]

[project.scripts]
vectorvault = "vectorvault.cli:main"   # Links the terminal command straight to your CLI main function

[tool.setuptools.packages.find]
where = ["."]
include = ["vectorvault*"]
